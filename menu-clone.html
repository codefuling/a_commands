<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 리스트 클론</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }
    .menu {
      display: flex;
      gap: 24px;
      padding: 12px 20px;
      overflow-x: auto;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #333;
      font-size: 12px;
      min-width: 48px;
    }
    .icon {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #f3f4f6;
      transition: transform 0.15s ease;
    }
    .menu-item:hover .icon { transform: translateY(-2px); }
    .menu-item:nth-child(1) .icon { background: #e8f7ee; }
    .menu-item:nth-child(2) .icon { background: #fff4e5; }
    .menu-item:nth-child(3) .icon { background: #eaf2ff; }
    .menu-item:nth-child(4) .icon { background: #fdeeee; }
    .label { white-space: nowrap; }
  </style>
</head>
<body>
  <nav class="menu">
    <!-- 예시(FewShot): 청소 -->
    <a class="menu-item" href="#">
      <span class="icon">🧹</span>
      <span class="label">청소</span>
    </a>
    <a class="menu-item" href="#">
      <span class="icon">🛋️</span>
      <span class="label">가구</span>
    </a>
    <a class="menu-item" href="#">
      <span class="icon">🍚</span>
      <span class="label">음식</span>
    </a>
    <a class="menu-item" href="#">
      <span class="icon">🏋️</span>
      <span class="label">운동</span>
    </a>
  </nav>
</body>
</html>
